name: ci-cd

on:
  push:
    branches:
      - master
      - ci-cd-github-actions
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  BACKEND_IMAGE_NAME: gitops-coaching-backend
  FRONTEND_IMAGE_NAME: gitops-coaching-frontend
  SONAR_PROJECT_KEY: gitops_coaching
  SONAR_ORGANIZATION: your-sonarcloud-organization

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest -q

      - name: Scan code with SonarCloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectBaseDir=backend
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}

  container:
    name: Container build, scan, and publish
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: images
        run: |
          OWNER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$OWNER" ]; then
            OWNER="${{ github.repository_owner }}"
          fi

          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "backend_image=$OWNER/${BACKEND_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$OWNER/${FRONTEND_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t "${{ steps.images.outputs.backend_image }}:${{ steps.images.outputs.tag }}" backend

      - name: Build frontend image
        run: docker build -t "${{ steps.images.outputs.frontend_image }}:${{ steps.images.outputs.tag }}" frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backend_image }}:${{ steps.images.outputs.tag }}
          format: table
          exit-code: 0

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend_image }}:${{ steps.images.outputs.tag }}
          format: table
          exit-code: 0

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker tag "${{ steps.images.outputs.backend_image }}:${{ steps.images.outputs.tag }}" "${{ steps.images.outputs.backend_image }}:latest"
          docker push "${{ steps.images.outputs.backend_image }}:${{ steps.images.outputs.tag }}"
          docker push "${{ steps.images.outputs.backend_image }}:latest"

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker tag "${{ steps.images.outputs.frontend_image }}:${{ steps.images.outputs.tag }}" "${{ steps.images.outputs.frontend_image }}:latest"
          docker push "${{ steps.images.outputs.frontend_image }}:${{ steps.images.outputs.tag }}"
          docker push "${{ steps.images.outputs.frontend_image }}:latest"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: container
    steps:
      - name: Echo deploy placeholder
        run: |
          echo "Deploy stage placeholder: the real deployment will come later with Argo CD and Minikube."
