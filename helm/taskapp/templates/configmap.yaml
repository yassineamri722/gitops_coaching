apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskapp.fullname" . }}-config
  labels:
    {{- include "taskapp.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}