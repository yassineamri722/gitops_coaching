apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskapp.fullname" . }}-secret
  labels:
    {{- include "taskapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword est obligatoire (--set secret.postgresPassword=...)" .Values.secret.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:%d/%s" .Values.config.postgresUser .Values.secret.postgresPassword (include "taskapp.fullname" .) (int .Values.postgres.service.port) .Values.config.postgresDb | quote }}